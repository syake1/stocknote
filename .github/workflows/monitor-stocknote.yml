name: Stocknote 15分監視更新

on:
  workflow_dispatch:
  schedule:
    # 平日JST 09:00〜15:59。正確な前場・後場判定はPython側で行う。
    - cron: '*/15 0-6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stocknote-candidate-data
  cancel-in-progress: false

jobs:
  update-active-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Tokyo
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Update active candidates only
        run: python monitor_candidates.py
      - name: Persist values, states and completed history
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Refresh Stocknote monitored candidates"
            git pull --rebase origin main
            git push
          else
            echo "No active candidate changes"
          fi
