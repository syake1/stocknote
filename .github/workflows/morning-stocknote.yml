name: Stocknote 全銘柄自動スキャン

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 日本時間の平日に自動実行する。
    # 朝会 06:30 JST
    - cron: '30 21 * * 0-4'
    # 朝 08:15 JST
    - cron: '15 23 * * 0-4'
    # 前場 09:05 / 10:05 / 11:05 JST
    - cron: '5 0,1,2 * * 1-5'
    # 後場 12:35 / 13:35 / 14:35 JST
    - cron: '35 3,4,5 * * 1-5'
    # 大引け後 15:40 JST（終値で最終スキャン）
    - cron: '40 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: stocknote-candidate-data
  cancel-in-progress: false

jobs:
  morning-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      STOCKNOTE_TOP_N: '10'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Validate source
        run: python -m py_compile morning_scan.py stocknote_universe.py stocknote_detail.py stocknote_fundamentals.py

      - name: Check saved SBI universe
        run: |
          test -f data/saved_universe.csv || (echo 'ERROR: data/saved_universe.csv is not in the repository. Streamlit local storage is not visible to GitHub Actions.' && exit 2)
          python - <<'PY'
          import pandas as pd
          p='data/saved_universe.csv'
          d=pd.read_csv(p,dtype=str,encoding='utf-8-sig')
          print(f'loaded {len(d)} rows from {p}')
          PY

      - name: Scan and send Discord candidates
        env:
          # 06:30の定期実行と手動テストだけ朝会を送信する。
          STOCKNOTE_SEND_MEETING: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 21 * * 0-4') && '1' || '0' }}
        run: python morning_scan.py

      - name: Save monitoring list
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update Stocknote candidate monitoring data"
            git pull --rebase origin main
            git push
          else
            echo "No monitoring data changes"
          fi
