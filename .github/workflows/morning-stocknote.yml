name: Stocknote 朝スキャン

on:
  workflow_dispatch:
  schedule:
    # 08:15 JST Mon-Fri. GitHub cron is UTC.
    - cron: '15 23 * * 0-4'

permissions:
  contents: read

concurrency:
  group: stocknote-morning-scan
  cancel-in-progress: true

jobs:
  morning-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      STOCKNOTE_TOP_N: '10'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Validate source
        run: python -m py_compile morning_scan.py stocknote_universe.py stocknote_detail.py stocknote_fundamentals.py

      - name: Check saved SBI universe
        run: |
          test -f data/saved_universe.csv || (echo 'ERROR: data/saved_universe.csv is not in the repository. Streamlit local storage is not visible to GitHub Actions.' && exit 2)
          python - <<'PY'
          import pandas as pd
          p='data/saved_universe.csv'
          d=pd.read_csv(p,dtype=str,encoding='utf-8-sig')
          print(f'loaded {len(d)} rows from {p}')
          PY

      - name: Scan and send Discord candidates
        run: python morning_scan.py
