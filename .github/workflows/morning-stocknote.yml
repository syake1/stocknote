name: Stocknote 朝スキャン

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. 23:15 UTC = 08:15 JST (Mon-Fri).
    - cron: '15 23 * * 0-4'

permissions:
  contents: read

concurrency:
  group: stocknote-morning-scan
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Validate Stocknote source
        run: |
          python -m py_compile app.py stocknote_detail.py stocknote_fundamentals.py stocknote_universe.py
          python - <<'PY'
          import stocknote_universe
          import stocknote_detail
          import stocknote_fundamentals
          print('Stocknote modules loaded successfully')
          PY

      - name: Report scheduled run
        run: echo "Stocknote morning workflow completed at $(date '+%Y-%m-%d %H:%M:%S %Z')"
